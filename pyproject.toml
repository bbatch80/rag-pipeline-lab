[project]
name = "raglab"
version = "0.1.0"
description = "Governed retrieval pipeline lab: parsing, hybrid retrieval, evaluation, orchestration, and access-controlled context services"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
raglab = "raglab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
