# The deployed platform: database, app, TLS edge. The same file runs on the
# Azure VM (SITE_ADDRESS=ragpipelinelab.com, Let's Encrypt) and on the Mac
# for the smoke test (SITE_ADDRESS=localhost, Caddy's internal CA).
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d
name: raglab

services:
  db:
    build: ../db
    image: ghcr.io/bbatch80/rag-pipeline-lab-db:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: raglab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raglab}
      POSTGRES_DB: raglab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro     # roles, then the snapshot restore — first start only
      - ./snapshot:/snapshot:ro                        # raglab.dump from `raglab snapshot`
    healthcheck:
      # over TCP on purpose: during the first-start restore the init server
      # answers only on the socket, and the app connects over TCP
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U raglab -d raglab"]
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 600s                               # a 280 MB restore on first start

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/bbatch80/rag-pipeline-lab:${TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAGLAB_DATABASE_URL: postgresql://raglab:${POSTGRES_PASSWORD:-raglab}@db:5432/raglab
      OPENAI_API_KEY: ${OPENAI_API_KEY:?embedding key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?planner key}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      RAGLAB_DEMO_PASSWORD: ${RAGLAB_DEMO_PASSWORD:?demo login password}
      RAGLAB_SESSION_SECRET: ${RAGLAB_SESSION_SECRET:?session signing secret}
      RAGLAB_RERANKER: bge-base
      RAGLAB_RERANK_DTYPE: ${RAGLAB_RERANK_DTYPE:-fp32}   # bf16 on a CPU with AMX (the VM)
      RAGLAB_WARM_RERANKER: "on"
      RAGLAB_PLAN_CACHE: "on"
    expose:
      - "8000"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
