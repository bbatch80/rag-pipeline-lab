{% extends "layout.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<article class="narrow">
  <h2>Log in</h2>
  {% if error %}<p class="banner banner-error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login">
    <label>Username
      <input name="username" list="accounts" autocomplete="username" required autofocus>
      <datalist id="accounts">{% for u in accounts %}<option value="{{ u }}">{{ accounts[u] }}</option>{% endfor %}</datalist>
    </label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Log in</button>
  </form>
  <p><small>Demo accounts: {% for u in accounts %}<code>{{ u }}</code> ({{ accounts[u] }}){% if not loop.last %}, {% endif %}{% endfor %}. One shared demo password.</small></p>
</article>
{% endblock %}
