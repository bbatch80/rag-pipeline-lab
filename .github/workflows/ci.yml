name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: raglab
          POSTGRES_PASSWORD: raglab
          POSTGRES_DB: raglab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U raglab -d raglab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run raglab init-db
      - run: uv run pytest -v

  docling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group docling
      - uses: actions/cache@v4
        with:
          path: ~/.cache/docling/models
          key: docling-models-${{ hashFiles('uv.lock') }}
      - run: test -d ~/.cache/docling/models || uv run docling-tools models download
      - run: uv run pytest tests/test_parser_backends.py -v
