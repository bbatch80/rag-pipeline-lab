{% extends "layout.html" %}
{% block title %}Ask{% endblock %}
{% block content %}
<hgroup><h2>Ask</h2><p>One question, no hints. What comes back is the context your role is entitled to.</p></hgroup>
<form hx-post="/ui/ask" hx-target="#result" hx-indicator="#busy" class="askbox">
  <input type="text" name="question" placeholder="e.g. What is the calendar year deductible for the High Option in 2026?" required autofocus>
  <button type="submit">Ask</button>
</form>
<p id="busy" class="htmx-indicator" aria-busy="true">Routing, searching, reranking…</p>
<section id="result"></section>
{% endblock %}
