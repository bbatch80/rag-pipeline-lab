name: release

# A tag v2.x is a release: build the images, publish them to GHCR, then —
# behind the `production` environment's required approval — deploy to the
# host, smoke-test the live site, and roll back to the previous tag if the
# smoke test fails. The host needs Docker and a deploy user with SSH access;
# it never needs git or a checkout: the deploy files travel with the job.

on:
  push:
    tags: ["v2.*"]

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/${{ github.repository }}
  DB_IMAGE: ghcr.io/${{ github.repository }}-db

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: meta
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: db image
        uses: docker/build-push-action@v6
        with:
          context: db
          push: true
          tags: |
            ${{ env.DB_IMAGE }}:pg17
            ${{ env.DB_IMAGE }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=db
          cache-to: type=gha,scope=db,mode=max
      - name: app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    concurrency: production          # one deploy at a time
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n' \
            "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: ship the deploy files
        run: |
          ssh target 'mkdir -p /opt/raglab/deploy'
          scp -r deploy/compose.yml deploy/Caddyfile deploy/db-init deploy/deploy.sh target:/opt/raglab/deploy/
      - name: deploy
        id: deploy
        run: ssh target "bash /opt/raglab/deploy/deploy.sh up ${{ needs.build.outputs.version }}"
      - name: smoke
        id: smoke
        env:
          RAGLAB_DEMO_PASSWORD: ${{ secrets.RAGLAB_DEMO_PASSWORD }}
        run: uv run --no-default-groups raglab smoke --base-url "https://${{ vars.SITE_ADDRESS }}"
      - name: roll back
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          echo "smoke failed on ${{ needs.build.outputs.version }}: rolling back"
          ssh target "bash /opt/raglab/deploy/deploy.sh rollback"
          exit 1
