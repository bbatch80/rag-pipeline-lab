name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The database image carries pg_textsearch, so it is built here rather
      # than pulled as a service container.
      - run: docker build -t raglab-db:pg17 db
      - run: |
          docker run -d --name raglab-db -p 5433:5432 \
            -e POSTGRES_USER=raglab -e POSTGRES_PASSWORD=raglab -e POSTGRES_DB=raglab \
            raglab-db:pg17
          for i in $(seq 1 30); do
            docker exec raglab-db pg_isready -U raglab -d raglab && break; sleep 2
          done
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run raglab init-db
      - run: uv run pytest -v
      # The deploy stack must at least parse: every variable it requires is
      # supplied a placeholder here, as deploy/.env does on a host.
      - run: cp deploy/.env.example deploy/.env && docker compose -f deploy/compose.yml --env-file deploy/.env config -q

  # Retrieval eval gate. Runs on the self-hosted runner beside the real,
  # fully indexed database (hosted runners start empty and hold no keys).
  # A category, group, or guardrail falling below eval/baseline.json fails
  # the job, and branch protection makes that block the merge.
  gate:
    # Same-repo pull requests only. Never a fork's PR: a fork can edit this
    # workflow and the runner holds the real database and keys. Not on push
    # to main either: a squash merge re-runs CI on the tree the PR gate just
    # verified, so the twelve-minute gate is not repeated.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    concurrency:
      group: raglab-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group rerank --group phi
      - run: uv run raglab status
      - run: uv run raglab eval-retrieval --gate --label ci
      - run: uv run raglab deid-eval --sample 60 --gate
