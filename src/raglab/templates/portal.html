{% extends "layout.html" %}
{% block title %}Surfaces{% endblock %}
{% block content %}
<div class="portal-head"><h2>AI App Dashboard</h2></div>
<div class="doors tiles">
  {% for surface in surface_titles if surface in me.surfaces %}
  <a href="/{{ surface }}" class="tile door">
    <h3>{{ surface_titles[surface] }}</h3>
    <p>{{ surface_blurbs[surface] }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
