name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The database image carries pg_textsearch, so it is built here rather
      # than pulled as a service container.
      - run: docker build -t raglab-db:pg17 db
      - run: |
          docker run -d --name raglab-db -p 5433:5432 \
            -e POSTGRES_USER=raglab -e POSTGRES_PASSWORD=raglab -e POSTGRES_DB=raglab \
            raglab-db:pg17
          for i in $(seq 1 30); do
            docker exec raglab-db pg_isready -U raglab -d raglab && break; sleep 2
          done
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run raglab init-db
      - run: uv run pytest -v

  docling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group docling
      - uses: actions/cache@v4
        with:
          path: ~/.cache/docling/models
          key: docling-models-${{ hashFiles('uv.lock') }}
      - run: test -d ~/.cache/docling/models || uv run docling-tools models download
      - run: uv run pytest tests/test_parser_backends.py -v

  # Retrieval eval gate. Runs on the self-hosted runner beside the real,
  # fully indexed database (hosted runners start empty and hold no keys).
  # A regression below any threshold in eval_retrieval.THRESHOLDS fails
  # the job, and branch protection makes that block the merge.
  gate:
    # Never run fork PRs on the self-hosted machine: a fork can edit this
    # workflow. Same-repo branches and pushes to main only.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    concurrency:
      group: raglab-gate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --group rerank
      - run: uv run raglab status
      - run: uv run raglab eval-retrieval --gate --label ci
