[project]
name = "raglab"
version = "0.1.0"
description = "Governed retrieval pipeline lab: parsing, hybrid retrieval, evaluation, orchestration, and access-controlled context services"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0.0",
    "click>=8.1",
    "en-core-web-sm",
    "httpx>=0.28.1",
    "openai>=3.3.1",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "unstructured[pdf]>=0.27.1",
]

[project.scripts]
raglab = "raglab.cli:main"

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "pytest>=8.0",
]
docling = [
    "docling>=2.121.0",
]
phi = [
    "en-core-web-lg",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
]
rerank = [
    "sentence-transformers>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
